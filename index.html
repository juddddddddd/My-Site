<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的小站</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login">
  <div class="box card">
    <h1 id="lt">欢迎回来</h1>
    <div class="ph">这里是一句占位说明文字</div>
    <input id="em" type="email" placeholder="邮箱" autocomplete="email">
    <input id="u" class="hidden" placeholder="用户名（显示名称，2–20 位）" autocomplete="nickname">
    <input id="p" type="password" placeholder="密码" autocomplete="current-password">
    <div class="err" id="err"></div>
    <button class="btn" id="go">登录</button>
    <button class="btn ghost" id="sw">没有账号？去注册</button>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <h2>网站名称占位</h2>
    <div class="who"><span class="tag hidden" id="adm">管理员</span><div class="av" id="av">U</div><button class="btn ghost" id="out">退出</button></div>
  </header>

  <section id="home" class="on">
    <div class="card" id="hero">
      <div class="row"><div><h3 id="ht" style="margin:0 0 6px"></h3><div class="ph logtxt" id="hb"></div></div><span class="ctl" id="hc"></span></div>
    </div>
    <div class="grid2" id="hcards"></div>
    <div class="hidden" id="hadd"><button class="btn ghost" id="hab">＋ 添加卡片</button></div>
    <div class="card hidden" id="hform">
      <b id="hft">编辑主页</b>
      <input id="hti" placeholder="标题占位" style="margin-top:10px">
      <textarea id="hbi" placeholder="内容占位" rows="4"></textarea>
      <div class="send" style="margin-top:10px"><button class="btn" id="hs">保存</button><button class="btn ghost" id="hx">取消</button></div>
    </div>
  </section>

  <section id="calendar">
    <div class="card">
      <div class="calhead"><button class="btn ghost" id="pm">‹</button><b id="ym"></b><button class="btn ghost" id="nm">›</button></div>
      <div class="cal" id="cal" style="margin-top:12px"></div>
    </div>
    <div class="card"><b id="seld"></b>
      <div class="send" style="margin:10px 0"><input id="ei" placeholder="添加日程占位"><button class="btn" id="ea">添加</button></div>
      <div id="el" class="list"></div>
    </div>
  </section>

  <section id="countdown">
    <div class="card"><div class="addrow">
      <input id="cn" placeholder="倒数日名称">
      <input id="cdt" type="date">
      <button class="btn" id="cadd">添加</button>
    </div></div>
    <div id="cdl" style="display:grid;gap:10px"></div>
  </section>

  <section id="chat">
    <div class="card chat">
      <div class="msgs" id="msgs"></div>
      <div class="send"><input id="mi" placeholder="输入消息占位"><button class="btn" id="ms">发送</button></div>
    </div>
  </section>

  <section id="board">
    <div class="card"><div class="send"><input id="bi" placeholder="写下留言占位"><button class="btn" id="bs">留言</button></div></div>
    <div id="bl" style="display:grid;gap:10px"></div>
  </section>

  <section id="status">
    <div class="card">
      <b>今日状态</b>
      <div class="ph">选择一个状态占位</div>
      <div class="moods" id="moods">
        <button data-m="😊">😊<span>状态占位</span></button>
        <button data-m="😐">😐<span>状态占位</span></button>
        <button data-m="😴">😴<span>状态占位</span></button>
        <button data-m="🔥">🔥<span>状态占位</span></button>
      </div>
      <input id="note" placeholder="一句话备注占位" style="margin-top:12px">
      <div class="addrow" style="margin-top:10px;grid-template-columns:1fr auto"><input id="sd" type="date"><button class="btn" id="ss">保存</button></div>
    </div>
    <div id="sl" class="list"></div>
  </section>

  <section id="log">
    <div class="logcols">
      <div class="col">
        <div class="sh">更新记录</div>
    <div class="card hidden" id="lform">
      <b id="lft">发布更新</b>
      <input id="lv" placeholder="版本号占位，如 v1.0.0" style="margin-top:10px">
      <textarea id="lb" placeholder="更新内容占位" rows="4"></textarea>
      <div class="send" style="margin-top:10px"><button class="btn" id="ls">发布</button><button class="btn ghost hidden" id="lc">取消</button></div>
    </div>
    <div id="ll" class="list"></div>
      </div>
      <div class="col">
        <div class="card" id="plan">
      <b>计划更新</b>
      <div class="send hidden" id="pform" style="margin:10px 0"><input id="pi" placeholder="添加计划占位"><button class="btn" id="pa">添加</button></div>
      <div id="pl" class="list" style="margin-top:10px"></div>
    </div>
        <div class="card" id="req">
      <b>求更新</b>
      <div class="send" style="margin:10px 0"><button class="btn" id="rb">求更新</button></div>
      <div class="hidden" id="rform" style="margin:0 0 10px">
        <div class="ph" style="margin-bottom:6px">可以写下理由（选填）。不想写，点「跳过」也会直接提交。</div>
        <div class="send"><input id="ri" placeholder="理由占位"><button class="btn" id="rs">提交</button><button class="btn ghost" id="rc">跳过</button></div>
      </div>
      <div id="rl" class="list"></div>
    </div>
      </div>
    </div>
  </section>

  <section id="diary">
    <div class="row"><b>日记</b><button class="btn plus" id="dadd" title="添加新方框">＋</button></div>
    <div class="dgrid" id="dg"></div>
  </section>

  <div class="mask" id="mask"></div>
  <aside class="drawer" id="drawer" aria-label="更多选项">
    <div class="dh"><b>更多</b><button class="btn ghost" id="dclose">✕</button></div>
    <button class="ditem" data-t="board"><span class="ic">📝</span>留言板</button>
    <button class="ditem" data-t="status"><span class="ic">🌤️</span>今日状态</button>
    <button class="ditem" data-t="diary"><span class="ic">📔</span>日记</button>
    <button class="ditem" data-t="log"><span class="ic">📋</span>更新日志</button>
  </aside>

  <nav><div class="in">
    <button class="on" data-t="home"><span class="ic">🏠</span>主页</button>
    <button data-t="calendar"><span class="ic">📅</span>日历</button>
    <button data-t="countdown"><span class="ic">⏳</span>倒数日</button>
    <button data-t="chat"><span class="ic">💬</span>聊天</button>
    <button id="more"><span class="ic">☰</span>更多</button>
  </div></nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function h(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function xbtn(fn,txt='✕',title='删除'){const b=h('button','x',txt);b.title=title;b.onclick=fn;return b}
const EMPTY=()=>({board:[],countdown:[],event:[],chat:[],status:[],log:[],plan:[],req:[],home:[],diary:[]});
let user=null,uid=null,admin=false,reg=false,mood=null,D=EMPTY(),P={},chan=null;
const mine=it=>it.uid===uid, who=it=>mine(it)?'':' · '+it.owner;

/* ---- supabase ---- */
const cfg=window.APP_CONFIG||{};
const configured=!!(cfg.url&&cfg.key)&&!/你的/.test(cfg.url+cfg.key);
// 只取网址的「域名」部分，自动去掉误带的 /rest/v1/ 等路径和结尾斜杠
const base=(()=>{try{return new URL(cfg.url.trim()).origin}catch(e){return (cfg.url||'').trim()}})();
const sb=configured?supabase.createClient(base,cfg.key.trim()):null;
const q=async p=>{const {data,error}=await p;if(error)throw error;return data};
const TB={board:['board_posts','body'],countdown:['countdowns','name'],event:['events','title'],chat:['chat_messages','body']};
const ROW={board:a=>({body:a}),chat:a=>({body:a}),countdown:(a,b)=>({name:a,date:b}),event:(a,b)=>({title:a,date:b})};
const ERR={'Invalid login credentials':'邮箱或密码错误','Email not confirmed':'邮箱尚未确认，请先点击邮件里的确认链接','User already registered':'该邮箱已注册'};
const msg=e=>ERR[e.message]||(/check constraint/i.test(e.message)?'内容长度不符合要求':/Database error saving new user/i.test(e.message)?'注册失败：用户名可能已被占用或格式不对':/row-level security/i.test(e.message)?'操作被拒绝：没有权限，或已达数量上限':/limit reached/i.test(e.message)?'数量已达上限，请先删除旧的':e.message);
const fail=e=>alert(msg(e)), act=p=>p.then(renderAll).catch(fail);

function norm(k,r){ // 统一成 {a,b,c} 结构
  const p=P[r.user_id]||{},o={id:r.id,kind:k,uid:r.user_id,owner:p.username||'未知用户',adm:!!p.is_admin,created:r.created_at,a:'',b:'',c:''};
  if(k==='board'||k==='chat')o.a=r.body;
  else if(k==='countdown'){o.a=r.name;o.b=r.date}
  else if(k==='event'){o.a=r.title;o.b=r.date}
  else{o.a=r.mood;o.b=r.date;o.c=r.note||''}
  return o;
}
async function loadProfiles(){const d=await q(sb.from('profiles').select('id,username,is_admin'));P={};d.forEach(p=>P[p.id]=p)}
async function load(){
  await loadProfiles();
  if(!P[uid])throw new Error('账号资料缺失，请联系管理员');
  user=P[uid].username;admin=!!P[uid].is_admin;
  const [b,c,e,s,m,lg,pl,rq,hm,dr]=await Promise.all([
    q(sb.from('board_posts').select('*').order('created_at')),
    q(sb.from('countdowns').select('*')),
    q(sb.from('events').select('*')),
    q(sb.from('statuses').select('*')),
    q(sb.from('chat_messages').select('*').order('created_at',{ascending:false}).limit(200)),
    q(sb.from('changelog').select('*').order('created_at',{ascending:false})),
    q(sb.from('planned_updates').select('*').order('created_at')),
    q(sb.from('update_requests').select('*')),
    q(sb.from('home_blocks').select('*').order('created_at')),
    q(sb.from('diary_entries').select('*').order('entry_date',{ascending:false}).order('created_at',{ascending:false}))]);
  D={board:b.map(r=>norm('board',r)),countdown:c.map(r=>norm('countdown',r)),event:e.map(r=>norm('event',r)),
     status:s.map(r=>norm('status',r)),chat:m.reverse().map(r=>norm('chat',r)),log:lg,plan:pl,req:rq.map(reqNorm),home:hm,diary:dr.map(diaryNorm)};
  ensureDraft();
  renderAll();syncStatus();
}
async function add(kind,a,b=''){
  const it=norm(kind,await q(sb.from(TB[kind][0]).insert(ROW[kind](a,b)).select().single()));
  if(!D[kind].some(x=>x.id===it.id))D[kind].push(it);
}
async function del(it){ // RLS 决定能否删除：本人或管理员
  const d=await q(sb.from(it.kind==='status'?'statuses':TB[it.kind][0]).delete().eq('id',it.id).select());
  if(!d.length)throw new Error('无权删除，或内容已被删除');
  D[it.kind]=D[it.kind].filter(x=>x.id!==it.id);
}
async function edit(it){ // 仅本人
  const v=prompt('编辑内容',it.a);if(v===null||!v.trim()||v.trim()===it.a)return;
  await q(sb.from(TB[it.kind][0]).update({[TB[it.kind][1]]:v.trim()}).eq('id',it.id).select().single());
  D[it.kind].find(x=>x.id===it.id).a=v.trim();
}
function ctl(it,canEdit=true){
  const s=h('span','ctl');
  if(canEdit&&mine(it))s.appendChild(xbtn(()=>act(edit(it)),'✎','编辑'));
  if(mine(it)||admin)s.appendChild(xbtn(()=>act(del(it))));
  return s;
}
async function reloadBoard(){await loadProfiles();D.board=(await q(sb.from('board_posts').select('*').order('created_at'))).map(r=>norm('board',r));renderBoard()}

/* ---- 聊天室实时 ---- */
function subscribe(){
  unsub();
  chan=sb.channel('chat-room').on('postgres_changes',{event:'*',schema:'public',table:'chat_messages'},async p=>{
    if(p.eventType==='INSERT'){
      const r=p.new;if(D.chat.some(x=>x.id===r.id))return;
      if(!P[r.user_id])await loadProfiles().catch(()=>{});
      if(D.chat.some(x=>x.id===r.id))return;
      D.chat.push(norm('chat',r));renderChat();
    }else if(p.eventType==='DELETE'){D.chat=D.chat.filter(x=>x.id!==p.old.id);renderChat()}
  }).subscribe();
}
function unsub(){if(chan){sb.removeChannel(chan);chan=null}}

/* ---- auth ---- */
function show(){
  $('login').classList.toggle('hidden',!!user);
  $('app').classList.toggle('hidden',!user);
  $('adm').classList.toggle('hidden',!admin);
  if(user){$('av').textContent=user.slice(0,1).toUpperCase()}
}
function mode(r){reg=r;$('lt').textContent=r?'创建账号':'欢迎回来';$('go').textContent=r?'注册':'登录';$('u').classList.toggle('hidden',!r);
  $('sw').textContent=r?'已有账号？去登录':'没有账号？去注册';$('p').autocomplete=r?'new-password':'current-password';$('err').textContent=''}
async function enter(){
  const {data:{session}}=await sb.auth.getSession();if(!session)return;
  uid=session.user.id;await load();subscribe();show();
}
async function login(){
  const em=$('em').value.trim(),p=$('p').value,u=$('u').value.trim();
  if(!em||!p||(reg&&!u)){$('err').textContent=reg?'请填写邮箱、用户名和密码':'请输入邮箱和密码';return}
  $('go').disabled=true;$('err').textContent='';
  try{
    if(reg){
      if(!/^[A-Za-z0-9_\u4e00-\u9fa5]{2,20}$/.test(u))throw new Error('用户名需为 2–20 位字母、数字、下划线或汉字');
      if(p.length<8)throw new Error('密码至少 8 位');
      if(!await q(sb.rpc('username_available',{n:u})))throw new Error('用户名已被占用');
      const {data,error}=await sb.auth.signUp({email:em,password:p,options:{data:{username:u}}});
      if(error)throw error;
      if(!data.session){mode(false);$('err').textContent='注册成功，请到邮箱点击确认链接后再登录';$('go').disabled=false;return}
    }else{const {error}=await sb.auth.signInWithPassword({email:em,password:p});if(error)throw error}
    $('p').value='';await enter();
  }catch(e){user=null;uid=null;admin=false;$('err').textContent=msg(e)}
  $('go').disabled=false;
}
$('go').onclick=login;
$('sw').onclick=()=>mode(!reg);
$('p').onkeydown=e=>{if(e.key==='Enter')login()};
function reset(){unsub();resetLogForm();closeReason();closeHome();resetDiary();user=null;uid=null;admin=false;D=EMPTY();P={};renderAll();syncStatus();show()}
$('out').onclick=async()=>{try{await sb.auth.signOut()}catch(e){}reset()};
if(!configured){$('err').textContent='尚未配置 Supabase：请编辑 config.js';$('go').disabled=true;show()}
else{
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&uid)reset()});
  sb.auth.getSession().then(({data})=>data.session?enter():null).catch(()=>{}).finally(show);
}

/* ---- tabs + drawer ---- */
const navBtns=document.querySelectorAll('nav button[data-t]');
function go(t){
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===t));
  let main=false;navBtns.forEach(b=>{const on=b.dataset.t===t;b.classList.toggle('on',on);if(on)main=true});
  $('more').classList.toggle('on',!main);
  if(t==='board'&&uid)reloadBoard().catch(()=>{}); // 打开留言板时刷新，看到别人的新留言
  if(t==='log'&&uid)reloadLog().catch(()=>{});
  if(t==='home'&&uid)reloadHome().catch(()=>{});
  if(t==='diary'&&uid)reloadDiary().catch(()=>{});
}
navBtns.forEach(b=>b.onclick=()=>go(b.dataset.t));
function drawer(open){$('drawer').classList.toggle('open',open);$('mask').classList.toggle('open',open)}
$('more').onclick=()=>drawer(true);
$('dclose').onclick=$('mask').onclick=()=>drawer(false);
document.querySelectorAll('.ditem').forEach(b=>b.onclick=()=>{go(b.dataset.t);drawer(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')drawer(false)});

/* ---- calendar + events ---- */
const now=new Date();let y=now.getFullYear(),m=now.getMonth(),sel=new Date(now.getFullYear(),now.getMonth(),now.getDate());
function renderCal(){
  $('ym').textContent=y+' 年 '+(m+1)+' 月';
  const c=$('cal');c.innerHTML='';
  '日一二三四五六'.split('').forEach(w=>c.appendChild(h('div','wd',w)));
  const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  for(let i=0;i<first;i++)c.appendChild(document.createElement('span'));
  for(let d=1;d<=days;d++){
    const b=h('button','',d),dt=new Date(y,m,d);
    if(dt.toDateString()===now.toDateString())b.classList.add('today');
    if(dt.toDateString()===sel.toDateString())b.classList.add('sel');
    if(D.event.some(e=>e.b===ymd(dt)))b.classList.add('has');
    b.onclick=()=>{sel=dt;renderCal()};c.appendChild(b);
  }
  $('seld').textContent=sel.getFullYear()+' 年 '+(sel.getMonth()+1)+' 月 '+sel.getDate()+' 日';
  const list=$('el');list.innerHTML='';
  const evs=D.event.filter(e=>e.b===ymd(sel));
  if(!evs.length)list.appendChild(h('div','ph','暂无日程占位'));
  evs.forEach(e=>{const r=h('div','row'),t=h('span','',e.a);t.append(h('span','ph',who(e)));r.append(t,ctl(e));list.appendChild(r)});
}
$('pm').onclick=()=>{m--;if(m<0){m=11;y--}renderCal()};
$('nm').onclick=()=>{m++;if(m>11){m=0;y++}renderCal()};
async function addEvent(){const v=$('ei').value.trim();if(!v)return;
  try{await add('event',v,ymd(sel));$('ei').value='';renderCal()}catch(e){fail(e)}}
$('ea').onclick=addEvent;$('ei').onkeydown=e=>{if(e.key==='Enter')addEvent()};

/* ---- countdown ---- */
const day=86400000,t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
function renderCd(){
  const box=$('cdl');box.innerHTML='';
  if(!D.countdown.length)box.appendChild(h('div','ph','暂无倒数日占位'));
  const arr=D.countdown.map(c=>{const [a,b,d]=c.b.split('-').map(Number);return {c,d:new Date(a,b-1,d)}}).sort((p,q)=>p.d-q.d);
  arr.forEach(({c,d})=>{
    const diff=Math.round((d-t0)/day),el=h('div','card cd'),l=h('div');
    l.append(h('b','',c.a),h('div','ph',d.toLocaleDateString('zh-CN')+who(c)));
    const r=h('div','n');r.append(Math.abs(diff).toString(),h('small','',diff>=0?'天后':'天前'));
    const w=h('div','cdr');w.append(r,ctl(c));
    el.append(l,w);box.appendChild(el);
  });
}
$('cadd').onclick=async()=>{
  const v=$('cdt').value;if(!v)return;
  try{await add('countdown',$('cn').value.trim()||'倒数日名称占位',v);$('cn').value='';$('cdt').value='';renderCd()}catch(e){fail(e)}
};

/* ---- board（所有人共用） ---- */
function renderBoard(){
  const box=$('bl');box.innerHTML='';
  if(!D.board.length)box.appendChild(h('div','ph','暂无留言占位'));
  D.board.slice().sort((p,q)=>q.created.localeCompare(p.created)).forEach(p=>{
    const c=h('div','card row'),l=h('div');
    l.append(h('b','',p.owner));
    if(p.adm)l.append(h('span','tag','管理员'));
    l.append(h('span','ph',' · '+new Date(p.created).toLocaleString('zh-CN')),h('div','ph',p.a));
    c.append(l,ctl(p));box.appendChild(c);
  });
}
async function post(){const v=$('bi').value.trim();if(!v)return;
  try{await add('board',v);$('bi').value='';renderBoard()}catch(e){fail(e)}}
$('bs').onclick=post;$('bi').onkeydown=e=>{if(e.key==='Enter')post()};

/* ---- chat（公共聊天室，实时） ---- */
function renderChat(){
  const box=$('msgs');box.innerHTML='';
  if(!D.chat.length)box.appendChild(h('div','ph','暂无消息占位'));
  D.chat.forEach(c=>{
    const el=h('div','m'+(mine(c)?' me':'')),dt=new Date(c.created),tm=ymd(dt)+' '+pad(dt.getHours())+':'+pad(dt.getMinutes()); // 年-月-日 时:分
    el.append(h('div','mn',c.owner+(c.adm?' · 管理员':'')+' · '+tm),h('div','',c.a));
    if(mine(c)||admin)el.appendChild(xbtn(()=>act(del(c)),'✕','删除'));
    box.appendChild(el);
  });
  box.scrollTop=box.scrollHeight;
}
async function send(){const v=$('mi').value.trim();if(!v)return;
  try{await add('chat',v);$('mi').value='';renderChat()}catch(e){fail(e)}}
$('ms').onclick=send;$('mi').onkeydown=e=>{if(e.key==='Enter')send()};

/* ---- 今日状态（按日期记录） ---- */
function renderStatus(){
  const box=$('sl');box.innerHTML='';
  if(!D.status.length)box.appendChild(h('div','ph','暂无状态记录占位'));
  D.status.slice().sort((p,q)=>q.b.localeCompare(p.b)||q.id-p.id).forEach(s=>{
    const c=h('div','card row'),l=h('div');
    l.append(h('b','',s.b+'  '+s.a),h('span','ph',who(s)),h('div','ph',s.c||'备注占位'));
    c.append(l,ctl(s,false));box.appendChild(c);
  });
}
function syncStatus(){ // 按所选日期，把自己的状态载入编辑区
  const s=D.status.find(x=>mine(x)&&x.b===$('sd').value);
  mood=s?s.a:null;$('note').value=s?s.c:'';
  document.querySelectorAll('#moods button').forEach(b=>b.classList.toggle('on',b.dataset.m===mood));
}
document.querySelectorAll('#moods button').forEach(b=>b.onclick=()=>{
  mood=b.dataset.m;document.querySelectorAll('#moods button').forEach(x=>x.classList.toggle('on',x===b));
});
$('sd').onchange=syncStatus;
$('ss').onclick=async()=>{
  const date=$('sd').value;if(!date||!mood){alert('请选择日期和状态');return}
  try{const r=await q(sb.from('statuses').upsert({user_id:uid,date,mood,note:$('note').value.trim()},{onConflict:'user_id,date'}).select().single());
    const it=norm('status',r);D.status=D.status.filter(x=>x.id!==it.id);D.status.push(it);renderStatus()}catch(e){fail(e)}
};

/* ---- 更新日志（所有人可看，仅管理员可编辑） ---- */
let logEdit=null;
function renderLog(){
  $('lform').classList.toggle('hidden',!admin);$('pform').classList.toggle('hidden',!admin);renderPlan();renderReq();
  const box=$('ll');box.innerHTML='';
  if(!D.log.length)box.appendChild(h('div','ph','暂无更新日志占位'));
  D.log.forEach(e=>{
    const c=h('div','card row'),l=h('div');
    l.append(h('b','',e.version),h('span','ph',' · '+new Date(e.created_at).toLocaleDateString('zh-CN')),h('div','ph logtxt',e.body));
    c.append(l);
    if(admin){const s=h('span','ctl');s.append(xbtn(()=>startLogEdit(e),'✎','编辑'),xbtn(()=>delLog(e)));c.append(s)}
    box.appendChild(c);
  });
}
async function reloadLog(){
  await loadProfiles();
  const [lg,pl,rq]=await Promise.all([q(sb.from('changelog').select('*').order('created_at',{ascending:false})),q(sb.from('planned_updates').select('*').order('created_at')),q(sb.from('update_requests').select('*'))]);
  D.log=lg;D.plan=pl;D.req=rq.map(reqNorm);renderLog();
}
function resetLogForm(){logEdit=null;$('lv').value='';$('lb').value='';$('lft').textContent='发布更新';$('ls').textContent='发布';$('lc').classList.add('hidden')}
function startLogEdit(e){logEdit=e.id;$('lv').value=e.version;$('lb').value=e.body;$('lft').textContent='编辑更新';$('ls').textContent='保存修改';$('lc').classList.remove('hidden');$('lform').scrollIntoView?.({behavior:'smooth'})}
async function saveLog(){
  const version=$('lv').value.trim(),body=$('lb').value.trim();
  if(!version||!body){alert('请填写版本号和更新内容');return}
  try{
    if(logEdit){const r=await q(sb.from('changelog').update({version,body}).eq('id',logEdit).select().single());D.log=D.log.map(x=>x.id===r.id?r:x)}
    else{D.log.unshift(await q(sb.from('changelog').insert({version,body}).select().single()))}
    resetLogForm();renderLog();
  }catch(e){fail(e)}
}
async function delLog(e){
  if(!confirm('确定删除这条更新日志？'))return;
  try{const d=await q(sb.from('changelog').delete().eq('id',e.id).select());if(!d.length)throw new Error('无权删除，或内容已被删除');
    D.log=D.log.filter(x=>x.id!==e.id);if(logEdit===e.id)resetLogForm();renderLog()}catch(err){fail(err)}
}
$('ls').onclick=saveLog;$('lc').onclick=resetLogForm;

/* ---- 计划更新（仅管理员可编辑） ---- */
function renderPlan(){
  const box=$('pl');box.innerHTML='';
  if(!D.plan.length)box.appendChild(h('div','ph','暂无计划更新占位'));
  D.plan.forEach(p=>{
    const r=h('div','row sep');r.append(h('span','','• '+p.body));
    if(admin){const s=h('span','ctl');s.append(xbtn(()=>editPlan(p),'✎','编辑'),xbtn(()=>delPlan(p)));r.append(s)}
    box.appendChild(r);
  });
}
async function addPlan(){const v=$('pi').value.trim();if(!v)return;
  try{D.plan.push(await q(sb.from('planned_updates').insert({body:v}).select().single()));$('pi').value='';renderPlan()}catch(e){fail(e)}}
async function editPlan(p){const v=prompt('编辑计划内容',p.body);if(v===null||!v.trim()||v.trim()===p.body)return;
  try{const r=await q(sb.from('planned_updates').update({body:v.trim()}).eq('id',p.id).select().single());D.plan=D.plan.map(x=>x.id===r.id?r:x);renderPlan()}catch(e){fail(e)}}
async function delPlan(p){if(!confirm('确定删除这条计划？'))return;
  try{const d=await q(sb.from('planned_updates').delete().eq('id',p.id).select());if(!d.length)throw new Error('无权删除，或内容已被删除');D.plan=D.plan.filter(x=>x.id!==p.id);renderPlan()}catch(e){fail(e)}}
$('pa').onclick=addPlan;$('pi').onkeydown=e=>{if(e.key==='Enter')addPlan()};

/* ---- 求更新（所有人可提交，发布人可编辑/删除） ---- */
const reqNorm=r=>({id:r.id,uid:r.user_id,owner:(P[r.user_id]||{}).username||'未知用户',adm:!!(P[r.user_id]||{}).is_admin,created:r.created_at,reason:r.reason||''});
function renderReq(){
  const box=$('rl');box.innerHTML='';
  if(!D.req.length)box.appendChild(h('div','ph','暂无求更新占位'));
  D.req.slice().sort((a,b)=>b.created.localeCompare(a.created)).forEach(r=>{
    const row=h('div','row sep'),l=h('div');
    l.append(h('b','',r.owner));
    if(r.adm)l.append(h('span','tag','管理员'));
    l.append(h('span','ph',' · '+new Date(r.created).toLocaleString('zh-CN')),h('div','ph',r.reason||'未填写理由占位'));
    row.append(l);
    const s=h('span','ctl');
    if(r.uid===uid)s.append(xbtn(()=>editReq(r),'✎','编辑'));
    if(r.uid===uid||admin)s.append(xbtn(()=>delReq(r)));
    row.append(s);box.appendChild(row);
  });
}
function closeReason(){$('ri').value='';$('rform').classList.add('hidden')}
async function submitReq(withReason){ // 先点「求更新」打开输入框；填完点「提交」，或点「跳过」不带理由提交
  const reason=withReason?$('ri').value.trim():'';
  $('rs').disabled=$('rc').disabled=true;
  try{D.req.push(reqNorm(await q(sb.from('update_requests').insert({reason}).select().single())));closeReason();renderReq()}
  catch(e){fail(/row-level security|limit reached/i.test(e.message)?new Error('你的求更新已达 20 条上限，请先删除旧的'):e)}
  $('rs').disabled=$('rc').disabled=false;
}
$('rb').onclick=()=>{const f=$('rform');if(f.classList.contains('hidden')){f.classList.remove('hidden');$('ri').value='';$('ri').focus?.()}else closeReason()};
$('rs').onclick=()=>submitReq(true);$('rc').onclick=()=>submitReq(false);$('ri').onkeydown=e=>{if(e.key==='Enter')submitReq(true)};
async function editReq(r){const v=prompt('编辑理由（可留空）',r.reason);if(v===null||v.trim()===r.reason)return;
  try{const x=await q(sb.from('update_requests').update({reason:v.trim()}).eq('id',r.id).select().single());D.req=D.req.map(y=>y.id===r.id?reqNorm(x):y);renderReq()}catch(e){fail(e)}}
async function delReq(r){if(!confirm('确定删除这条求更新？'))return;
  try{const d=await q(sb.from('update_requests').delete().eq('id',r.id).select());if(!d.length)throw new Error('无权删除，或内容已被删除');D.req=D.req.filter(x=>x.id!==r.id);renderReq()}catch(e){fail(e)}}


/* ---- 主页内容（所有人可看，仅管理员可编辑） ---- */
let homeEdit=null; // null=未在编辑；'hero'=欢迎区；'new'=新卡片；对象=正在编辑的卡片
const HERO_DEF={title:'标题占位',body:'这里是欢迎语或今日概览的占位文字。'};
function renderHome(){
  const hero=D.home.find(x=>x.kind==='hero')||HERO_DEF;
  $('ht').textContent=hero.title;$('hb').textContent=hero.body;
  const hc=$('hc');hc.innerHTML='';if(admin)hc.appendChild(xbtn(()=>openHome('hero'),'✎','编辑'));
  const box=$('hcards');box.innerHTML='';
  const cards=D.home.filter(x=>x.kind==='card');
  if(!cards.length)box.appendChild(h('div','ph','暂无卡片占位'));
  cards.forEach(c=>{
    const el=h('div','card'),top=h('div','row');
    top.append(h('b','',c.title||'卡片标题占位'));
    if(admin){const s=h('span','ctl');s.append(xbtn(()=>openHome(c),'✎','编辑'),xbtn(()=>delHome(c)));top.append(s)}
    el.append(top,h('div','ph logtxt',c.body||'卡片内容占位'));box.appendChild(el);
  });
  $('hadd').classList.toggle('hidden',!admin);
  if(!admin)closeHome();
}
function openHome(t){
  homeEdit=t;$('hform').classList.remove('hidden');
  if(t==='new'){$('hft').textContent='添加卡片';$('hti').value='';$('hbi').value=''}
  else if(t==='hero'){const x=D.home.find(y=>y.kind==='hero')||HERO_DEF;$('hft').textContent='编辑欢迎区';$('hti').value=x.title;$('hbi').value=x.body}
  else{$('hft').textContent='编辑卡片';$('hti').value=t.title;$('hbi').value=t.body}
  $('hform').scrollIntoView?.({behavior:'smooth'});
}
function closeHome(){homeEdit=null;$('hform').classList.add('hidden');$('hti').value='';$('hbi').value=''}
async function saveHome(){
  const title=$('hti').value.trim(),body=$('hbi').value.trim();
  if(!title&&!body){alert('标题和内容不能都为空');return}
  try{
    if(homeEdit==='new'){D.home.push(await q(sb.from('home_blocks').insert({kind:'card',title,body}).select().single()))}
    else if(homeEdit==='hero'){
      const ex=D.home.find(x=>x.kind==='hero');
      const r=await q(ex?sb.from('home_blocks').update({title,body}).eq('id',ex.id).select().single():sb.from('home_blocks').insert({kind:'hero',title,body}).select().single());
      D.home=ex?D.home.map(x=>x.id===r.id?r:x):[...D.home,r];
    }else{const r=await q(sb.from('home_blocks').update({title,body}).eq('id',homeEdit.id).select().single());D.home=D.home.map(x=>x.id===r.id?r:x)}
    closeHome();renderHome();
  }catch(e){fail(e)}
}
async function delHome(c){
  if(!confirm('确定删除这张卡片？'))return;
  try{const d=await q(sb.from('home_blocks').delete().eq('id',c.id).select());if(!d.length)throw new Error('无权删除，或内容已被删除');
    D.home=D.home.filter(x=>x.id!==c.id);if(homeEdit&&homeEdit.id===c.id)closeHome();renderHome()}catch(e){fail(e)}
}
async function reloadHome(){D.home=await q(sb.from('home_blocks').select('*').order('created_at'));renderHome()}
$('hs').onclick=saveHome;$('hx').onclick=closeHome;$('hab').onclick=()=>openHome('new');

/* ---- 日记（两列方框；可设仅自己/所有人可见；管理员可删，用户可增、可改自己的） ---- */
// D.diary 里既有已保存的日记，也有还没保存的空白方框（draft）。点「保存」时，那个空白方框原地变成已保存的日记，不会多出新方框。
const diaryNorm=r=>({id:r.id,uid:r.user_id,owner:(P[r.user_id]||{}).username||'未知用户',date:r.entry_date,body:r.body,pub:!!r.is_public,created:r.created_at});
let diaryEdit={},diaryOpen=new Set(),dkey=0;
const newDraft=()=>({k:'d'+(++dkey),id:null,draft:true,date:ymd(new Date()),body:'',pub:false});
const ensureDraft=()=>{if(!D.diary.some(x=>x.draft))D.diary.unshift(newDraft())}; // 登录后默认显示一个空白方框
function resetDiary(){diaryEdit={};diaryOpen.clear()}
const wd=s=>{const [a,b,c]=s.split('-').map(Number);return '周'+'日一二三四五六'[new Date(a,b-1,c).getDay()]};
function toggleWide(key){diaryOpen.has(key)?diaryOpen.delete(key):diaryOpen.add(key);renderDiary()}
function editBox(st,key,onSave,onCancel){ // 新建 / 编辑用的方框
  const wide=diaryOpen.has(key),box=h('div','card dbox'+(wide?' wide':'')),top=h('div','dtop');
  const di=h('input');di.type='date';di.value=st.date;di.onchange=()=>{st.date=di.value};
  const sel=h('select');[['0','🔒 仅自己可见'],['1','🌐 所有人可见']].forEach(([v,t])=>{const o=h('option','',t);o.value=v;sel.appendChild(o)});
  sel.value=st.pub?'1':'0';sel.onchange=()=>{st.pub=sel.value==='1'};
  top.append(di,sel);
  const ta=h('textarea');ta.rows=wide?14:5;ta.placeholder='正文占位';ta.value=st.body;ta.oninput=()=>{st.body=ta.value};
  const bar=h('div','dbar'),ex=h('button','btn ghost',wide?'收起':'扩展'),sv=h('button','btn','保存');
  ex.onclick=()=>toggleWide(key);sv.onclick=onSave;bar.append(ex,sv);
  if(onCancel){const c=h('button','btn ghost','取消');c.onclick=onCancel;bar.append(c)}
  box.append(top,ta,bar);return box;
}
function readBox(e){ // 已保存的方框
  const key='e'+e.id,wide=diaryOpen.has(key),long=e.body.length>140||e.body.split('\n').length>5;
  const box=h('div','card dbox'+(wide?' wide':'')),top=h('div','row'),l=h('div');
  l.append(h('b','',e.date+' · '+wd(e.date)));
  if(!mine(e))l.append(h('span','ph',' · '+e.owner));
  l.append(h('span','tag',e.pub?'🌐 所有人可见':'🔒 仅自己可见'));
  const s=h('span','ctl');
  if(mine(e))s.append(xbtn(()=>{diaryEdit[e.id]={date:e.date,body:e.body,pub:e.pub};renderDiary()},'✎','编辑'));
  if(admin)s.append(xbtn(()=>delDiary(e)));
  top.append(l,s);
  box.append(top,h('div','ph logtxt dbody'+(long&&!wide?' clamp':''),e.body));
  if(long||wide){const ex=h('button','btn ghost sm',wide?'收起':'扩展');ex.onclick=()=>toggleWide(key);box.append(ex)}
  return box;
}
function renderDiary(){
  const g=$('dg');g.innerHTML='';const nd=D.diary.filter(x=>x.draft).length;
  D.diary.forEach(x=>{
    if(x.draft)g.appendChild(editBox(x,x.k,()=>saveDraft(x),nd>1?()=>{D.diary=D.diary.filter(y=>y!==x);renderDiary()}:null));
    else if(diaryEdit[x.id])g.appendChild(editBox(diaryEdit[x.id],'e'+x.id,()=>saveEdit(x),()=>{delete diaryEdit[x.id];renderDiary()}));
    else g.appendChild(readBox(x));
  });
}
const diaryErr=e=>fail(/limit reached/i.test(e.message)?new Error('日记数量已达上限（500 篇）'):e);
async function saveDraft(dr){
  const body=dr.body.trim();if(!body){alert('请先写点内容');return}if(!dr.date){alert('请选择日期');return}
  try{const saved=diaryNorm(await q(sb.from('diary_entries').insert({entry_date:dr.date,body,is_public:dr.pub}).select().single()));
    const i=D.diary.indexOf(dr);if(i>=0)D.diary[i]=saved;else D.diary.unshift(saved); // 原地变成已保存的日记
    if(diaryOpen.delete(dr.k))diaryOpen.add('e'+saved.id); // 展开状态也保留
    renderDiary()}catch(e){diaryErr(e)}
}
async function saveEdit(e){
  const st=diaryEdit[e.id],body=st.body.trim();if(!body){alert('正文不能为空');return}if(!st.date){alert('请选择日期');return}
  try{const r=diaryNorm(await q(sb.from('diary_entries').update({entry_date:st.date,body,is_public:st.pub}).eq('id',e.id).select().single()));
    D.diary=D.diary.map(x=>x.id===e.id?r:x);delete diaryEdit[e.id];renderDiary()}catch(err){fail(err)}
}
async function delDiary(e){
  if(!confirm('确定删除这个方框？'))return;
  try{const d=await q(sb.from('diary_entries').delete().eq('id',e.id).select());if(!d.length)throw new Error('无权删除，或内容已被删除');
    D.diary=D.diary.filter(x=>x.id!==e.id);delete diaryEdit[e.id];diaryOpen.delete('e'+e.id);renderDiary()}catch(err){fail(err)}
}
async function reloadDiary(){ // 已有方框的位置不变；别人新发的公开日记插在最前面（空白方框之后）
  await loadProfiles();
  const rows=(await q(sb.from('diary_entries').select('*').order('entry_date',{ascending:false}).order('created_at',{ascending:false}))).map(diaryNorm);
  const byId=new Map(rows.map(r=>[r.id,r])),kept=D.diary.filter(x=>x.draft||byId.has(x.id)).map(x=>x.draft?x:byId.get(x.id));
  const known=new Set(kept.filter(x=>!x.draft).map(x=>x.id)),fresh=rows.filter(r=>!known.has(r.id));
  let n=0;while(n<kept.length&&kept[n].draft)n++;
  D.diary=[...kept.slice(0,n),...fresh,...kept.slice(n)];renderDiary();
}
$('dadd').onclick=()=>{D.diary.unshift(newDraft());renderDiary()};

function renderAll(){renderCal();renderCd();renderBoard();renderChat();renderStatus();renderLog();renderHome();renderDiary()}
$('sd').value=ymd(now);
renderAll();
</script>
